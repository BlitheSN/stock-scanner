name: Stock Scan
on:
  schedule:
    - cron: '15 8 * * 1-5'
    - cron: '45 14 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner
        run: python scan.py
        env:
          ULTRA_TOKEN: ${{ secrets.ULTRA_TOKEN }}
          ULTRA_INSTANCE: ${{ secrets.ULTRA_INSTANCE }}

  winrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install winrate deps
        run: pip install yfinance pandas
      - name: Run winrate
        run: python winrate.py
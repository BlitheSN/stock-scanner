name: Stock Scan
on:
  schedule:
    - cron: '15 8 * * 1-5'
    - cron: '45 14 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install yfinance mplfinance requests
      - run: python scan.py
        env:
          ULTRA_TOKEN: ${{ secrets.ULTRA_TOKEN }}
          ULTRA_INSTANCE: ${{ secrets.ULTRA_INSTANCE }}

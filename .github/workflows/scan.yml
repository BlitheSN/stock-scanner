name: Stock Scan

on:
  schedule:
    - cron: '30 0 * * 1-5'  # 香港 08:30 早上掃美股
    - cron: '30 8 * * 1-5'  # 香港 16:30 下午掃港股+美股
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance pandas requests lxml html5lib
      - name: Run scan
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python scan.py
      - name: Commit history
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add triggers_history.csv hk_triggers_history.csv || true
          git commit -m "update history" || true
          git push || true